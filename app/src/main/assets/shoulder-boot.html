<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Game Star Box Hardware Awakening</title>
<style>
:root{--blue:#64b8ff;--cyan:#a9f3ff;--white:#f7fbff;--dim:#587080;--bg:#020408}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Segoe UI","PingFang SC",system-ui,sans-serif;user-select:none;touch-action:none}
body{display:grid;place-items:center}.root{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 48%,#07131d 0,#020509 26%,#000 64%)}
.stars{position:absolute;inset:0;opacity:.24;background-image:radial-gradient(circle,#8fcfff 0 1px,transparent 1.4px),radial-gradient(circle,#fff 0 1px,transparent 1.3px);background-size:91px 91px,137px 137px;background-position:13px 27px,61px 48px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 72%)}
.top{position:absolute;top:5.5vh;left:0;right:0;text-align:center;font-size:7px;letter-spacing:.34em;color:#526777}.top b{color:#a4cfe4}.stage{position:absolute;inset:12vh 7vw 12vh;display:grid;place-items:center}.phone{position:relative;width:min(78vw,1050px);height:min(53vh,430px);min-height:230px;border:1px solid rgba(207,234,248,.2);border-radius:34px;background:linear-gradient(180deg,#0a0e13,#030507);box-shadow:0 35px 110px rgba(0,0,0,.78),inset 0 1px rgba(255,255,255,.04);will-change:transform,filter}
.phone:before{content:"";position:absolute;inset:9px;border:1px solid rgba(163,205,230,.06);border-radius:27px}.display{position:absolute;left:5.1%;right:5.1%;top:10%;bottom:10%;overflow:hidden;border-radius:20px;border:1px solid rgba(168,210,234,.13);background:radial-gradient(circle at 50% 50%,rgba(38,106,156,.08),transparent 33%),#020608;box-shadow:inset 0 0 90px rgba(49,122,170,.08)}
.grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(rgba(130,197,230,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(130,197,230,.12) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.shoulder{position:absolute;top:-17px;width:28%;height:46px;border:1px solid rgba(211,236,249,.22);background:linear-gradient(180deg,#161c23,#070a0d);box-shadow:0 13px 28px rgba(0,0,0,.58),inset 0 1px rgba(255,255,255,.05);z-index:8;transition:.18s ease}.shoulder.left{left:7%;border-radius:18px 8px 6px 19px}.shoulder.right{right:7%;border-radius:8px 18px 19px 6px}.shoulder span{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:900;letter-spacing:.2em;color:#566875}.shoulder.left span{left:20px}.shoulder.right span{right:20px}.shoulder:after{content:"";position:absolute;left:12%;right:12%;bottom:5px;height:2px;background:#17222a;transition:.15s ease}.shoulder.awake{border-color:rgba(128,215,255,.72);box-shadow:0 13px 28px rgba(0,0,0,.58),0 0 30px rgba(79,178,255,.26),inset 0 0 28px rgba(74,158,255,.09)}.shoulder.awake span{color:#effbff}.shoulder.awake:after{background:linear-gradient(90deg,#4b90ff,#a7f3ff);box-shadow:0 0 14px rgba(100,211,255,.8)}.shoulder.down{transform:translateY(3px) scaleY(.94);filter:brightness(1.28)}
.jet{position:absolute;top:25px;width:34%;height:10px;opacity:0;filter:blur(.2px);pointer-events:none}.jet.left{left:8%;background:linear-gradient(90deg,rgba(104,210,255,.92),rgba(69,124,255,.28),transparent);transform-origin:left}.jet.right{right:8%;background:linear-gradient(270deg,rgba(104,210,255,.92),rgba(69,124,255,.28),transparent);transform-origin:right}.shoulder.awake+.jet{animation:jetPulse .9s ease-out}
.bus{position:absolute;top:50%;height:2px;width:32%;background:rgba(100,180,220,.11)}.bus.left{left:7%}.bus.right{right:7%}.fill{height:100%;width:100%;transform:scaleX(0);background:linear-gradient(90deg,#4d87ff,#b4f5ff);box-shadow:0 0 18px rgba(102,212,255,.62);transition:transform .06s linear}.bus.left .fill{transform-origin:left}.bus.right .fill{transform-origin:right;background:linear-gradient(270deg,#4d87ff,#b4f5ff)}
.core{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(155,216,244,.18);box-shadow:0 0 0 18px rgba(79,151,203,.025),0 0 80px rgba(71,161,221,.07)}.core:before,.core:after{content:"";position:absolute;inset:15px;border-radius:50%;border:1px solid rgba(130,204,236,.15)}.core:after{inset:35px;background:#07111a;border-color:rgba(173,226,248,.24);box-shadow:0 0 16px rgba(89,190,255,.08)}.core.live{border-color:rgba(142,226,255,.75);box-shadow:0 0 0 18px rgba(79,151,203,.05),0 0 70px rgba(69,178,255,.3)}.core.live:before{animation:spin 2.2s linear infinite;border-top-color:#9cecff;border-right-color:#5b8fff}.core.ready:after{background:#dff9ff;box-shadow:0 0 24px #85d9ff,0 0 60px rgba(95,157,255,.65)}
.copy{position:absolute;left:0;right:0;top:57%;text-align:center;z-index:5}.copy small{display:block;font-size:7px;letter-spacing:.32em;color:#537080;margin-bottom:8px}.copy b{display:block;font-size:clamp(18px,2.2vw,31px);font-weight:700;letter-spacing:.1em}.copy p{margin:9px 0 0;font-size:9px;letter-spacing:.14em;color:#718796}.copy.sync b{font-size:clamp(15px,1.8vw,24px);color:#dff8ff}
.systems{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);display:flex;gap:24px;z-index:6}.sys{display:flex;align-items:center;gap:7px;font-size:6px;letter-spacing:.17em;color:#465762}.lamp{width:5px;height:5px;border-radius:50%;background:#15212a;box-shadow:0 0 0 1px rgba(146,195,219,.12)}.sys.on{color:#8ba9ba}.sys.on .lamp{background:#9cecff;box-shadow:0 0 9px #5db8ff}
.touch{position:absolute;top:-10px;width:36%;height:82px;z-index:20}.touch.left{left:3%}.touch.right{right:3%}
.brand{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}.brandInner{text-align:center}.brandMark{position:relative;width:124px;height:48px;margin:0 auto 17px}.brandMark i{position:absolute;border:2px solid #f4fbff}.brandMark .l{left:0;top:8px;width:38px;height:32px;border-right:0;border-radius:16px 5px 5px 16px}.brandMark .r{right:0;top:8px;width:38px;height:32px;border-left:0;border-radius:5px 16px 16px 5px}.brandMark .c{left:36px;right:36px;top:4px;bottom:4px;box-shadow:0 0 24px rgba(126,216,255,.42)}.brand b{font-size:clamp(24px,3.1vw,46px);letter-spacing:.23em;margin-right:-.23em}.brand small{display:block;margin-top:9px;color:#617684;font-size:7px;letter-spacing:.34em}
.hint{position:absolute;bottom:5.2vh;left:0;right:0;text-align:center;font-size:6px;letter-spacing:.2em;color:#31404a}.hint span{color:#66808f}.root.armed .core{animation:coreBreath .55s ease-in-out infinite alternate}.root.igniting .copy,.root.igniting .systems{animation:fade .16s forwards}.root.igniting .phone{animation:shake .045s steps(2,end) infinite}.root.igniting .bus .fill{transform:scaleX(1)!important;filter:brightness(1.7)}.root.igniting .core{animation:igniteCore 1.05s cubic-bezier(.18,.82,.16,1) forwards}.root.igniting .shoulder.left{animation:leftIn 1.05s cubic-bezier(.18,.82,.16,1) forwards}.root.igniting .shoulder.right{animation:rightIn 1.05s cubic-bezier(.18,.82,.16,1) forwards}.root.branding .phone{animation:none;opacity:0;transition:opacity .08s linear}.root.branding .brand{animation:brandIn .58s cubic-bezier(.2,.82,.2,1) forwards}
@keyframes jetPulse{0%{opacity:0;transform:scaleX(.2)}18%{opacity:1}100%{opacity:0;transform:scaleX(1.25)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes coreBreath{to{filter:brightness(1.4);box-shadow:0 0 0 24px rgba(79,151,203,.05),0 0 95px rgba(69,178,255,.42)}}@keyframes fade{to{opacity:0}}@keyframes shake{0%{transform:translate(-2px,.8px)}100%{transform:translate(2px,-.8px)}}@keyframes igniteCore{0%{transform:translate(-50%,-50%) scale(1)}62%{transform:translate(-50%,-50%) scale(1.28);filter:brightness(2)}74%{filter:brightness(.1)}100%{transform:translate(-50%,-50%) scale(.1);opacity:0}}@keyframes leftIn{0%{transform:none}60%{transform:translateX(20px)}100%{transform:translateX(120%) scaleX(.6);opacity:0}}@keyframes rightIn{0%{transform:none}60%{transform:translateX(-20px)}100%{transform:translateX(-120%) scaleX(.6);opacity:0}}@keyframes brandIn{0%{opacity:0;transform:scale(.965)}22%{opacity:1}64%{transform:scale(1.015)}100%{opacity:1;transform:none}}
@media(max-height:520px){.stage{inset:8vh 6vw 9vh}.phone{height:62vh;min-height:210px}.top{top:3.4vh}.hint{bottom:2.7vh}.systems{bottom:10%}}
</style>
</head>
<body>
<div class="root" id="root">
  <div class="stars"></div>
  <div class="top"><b>GAME STAR BOX</b> // HARDWARE AWAKENING</div>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="shoulder left" id="ls"><span>L</span></div><div class="jet left"></div>
      <div class="shoulder right" id="rs"><span>R</span></div><div class="jet right"></div>
      <div class="touch left" id="lt"></div><div class="touch right" id="rt"></div>
      <div class="display">
        <div class="grid"></div>
        <div class="bus left"><div class="fill" id="lf"></div></div>
        <div class="bus right"><div class="fill" id="rf"></div></div>
        <div class="core" id="core"></div>
        <div class="copy" id="copy"><small id="kicker">CONTROL SURFACE</small><b id="title">LEFT SHOULDER</b><p id="sub">轻触左肩键，唤醒左侧控制模块</p></div>
        <div class="systems"><div class="sys" id="sysCore"><i class="lamp"></i>CORE</div><div class="sys" id="sysLibrary"><i class="lamp"></i>LIBRARY</div><div class="sys" id="sysSurface"><i class="lamp"></i>INTERFACE</div></div>
      </div>
    </div>
  </div>
  <div class="brand"><div class="brandInner"><div class="brandMark"><i class="l"></i><i class="c"></i><i class="r"></i></div><b>GAME STAR BOX</b><small>SYSTEM ONLINE</small></div></div>
  <div class="hint">PHYSICAL CONTROL LINK <span>·</span> FIRST BOOT</div>
</div>
<script>
(() => {
  const root=document.getElementById('root'),ls=document.getElementById('ls'),rs=document.getElementById('rs');
  const lf=document.getElementById('lf'),rf=document.getElementById('rf'),core=document.getElementById('core');
  const copy=document.getElementById('copy'),kicker=document.getElementById('kicker'),title=document.getElementById('title'),sub=document.getElementById('sub');
  const sys={CORE_RUNTIME:document.getElementById('sysCore'),GAME_CATALOG:document.getElementById('sysLibrary'),MAIN_SURFACE:document.getElementById('sysSurface')};
  let lastPhase='',lastLevel=-1,ignitionStarted=false,audio=null;
  function bridge(){return window.GSBShoulderBoot||null}
  function ctx(){if(audio)return audio;try{audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(_){audio=null}return audio}
  function tone(a,b,d,g=.035,type='sine'){const c=ctx();if(!c)return;const t=c.currentTime,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(180,a),t);o.frequency.exponentialRampToValueAtTime(Math.max(180,b),t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.03)}
  function click(side){tone(side==='L'?440:520,side==='L'?760:860,.08,.045,'triangle')}
  function lock(){tone(540,940,.12,.04,'sine');setTimeout(()=>tone(880,1320,.1,.028,'sine'),80)}
  function levelCue(level){const base=260+Math.max(1,Math.min(4,level))*55;tone(base,base+90,.045,.018,'triangle')}
  function setText(k,t,s,sync=false){kicker.textContent=k;title.textContent=t;sub.textContent=s;copy.classList.toggle('sync',sync)}
  function setCharge(el,p){el.style.transform=`scaleX(${Math.max(0,Math.min(1,(p||0)/100))})`}
  function applyPhase(s){
    if(!s)return;ls.classList.toggle('down',!!s.leftDown);rs.classList.toggle('down',!!s.rightDown);
    ls.classList.toggle('awake',s.phase!=='LEFT_TAP'||!!s.leftDown);rs.classList.toggle('awake',['RIGHT_HOLD','BOTH_HOLD','ARMED','IGNITING','COMPLETE'].includes(s.phase)||!!s.rightDown||s.leftCalibrated);
    core.classList.toggle('live',['BOTH_HOLD','ARMED','IGNITING','COMPLETE'].includes(s.phase));core.classList.toggle('ready',['ARMED','IGNITING','COMPLETE'].includes(s.phase));
    root.classList.toggle('armed',s.phase==='ARMED');
    if(s.phase==='LEFT_TAP'){setCharge(lf,0);setCharge(rf,0);setText('CONTROL SURFACE','LEFT SHOULDER','轻触左肩键，唤醒左侧控制模块')}
    else if(s.phase==='LEFT_HOLD'){setCharge(lf,s.progress);setText('POWER TEST','LEFT MODULE',s.progress>=100?'松开肩键，锁定左侧模块':'长按左肩键，让模块完成上电')}
    else if(s.phase==='RIGHT_TAP'){setCharge(lf,100);setText('CONTROL SURFACE','RIGHT SHOULDER','轻触右肩键，唤醒右侧控制模块')}
    else if(s.phase==='RIGHT_HOLD'){setCharge(lf,100);setCharge(rf,s.progress);setText('POWER TEST','RIGHT MODULE',s.progress>=100?'松开肩键，锁定右侧模块':'长按右肩键，让模块完成上电')}
    else if(s.phase==='BOTH_HOLD'){setCharge(lf,100);setCharge(rf,100);setText('CONTROL LINK','L + R','同时压住左右肩键，连接整机控制核心')}
    else if(s.phase==='ARMED'){setCharge(lf,100);setCharge(rf,100);setText('SYSTEM LINK','CORE SYNCHRONIZING','控制模块已锁定 · 正在完成系统同步',true)}
    else if(s.phase==='IGNITING')beginIgnition();
    if(s.phase!==lastPhase){
      if(s.phase==='LEFT_HOLD')click('L');
      if(s.phase==='RIGHT_TAP'){lock();click('R')}
      if(s.phase==='BOTH_HOLD')lock();
      if(s.phase==='ARMED')lock();
      lastPhase=s.phase;
    }
    if(['LEFT_HOLD','RIGHT_HOLD','BOTH_HOLD'].includes(s.phase)&&s.level>0&&s.level!==lastLevel)levelCue(s.level);
    lastLevel=s.level;
  }
  function beginIgnition(){if(ignitionStarted)return;ignitionStarted=true;root.classList.remove('armed');root.classList.add('igniting');tone(320,220,.5,.045,'sawtooth');setTimeout(()=>tone(420,260,.4,.05,'sine'),300);setTimeout(()=>{root.classList.remove('igniting');root.classList.add('branding');tone(360,720,.24,.06,'triangle');tone(280,220,.24,.035,'sine')},1080);setTimeout(()=>{try{bridge()&&bridge().visualComplete()}catch(_){}},1820)}
  function touch(el,side){el.addEventListener('pointerdown',e=>{e.preventDefault();try{ctx();bridge()&&bridge().touch(side,true)}catch(_){}});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();try{bridge()&&bridge().touch(side,false)}catch(_){}}))}
  touch(document.getElementById('lt'),'LEFT');touch(document.getElementById('rt'),'RIGHT');
  window.onGSBShoulderState=applyPhase;
  window.onGSBProvisioningState=s=>{const done=new Set((s&&s.completed)||[]);Object.entries(sys).forEach(([k,el])=>el&&el.classList.toggle('on',done.has(k)))};
  function boot(){const b=bridge();if(!b){setTimeout(boot,40);return}try{b.ready()}catch(_){}let mode='INTERACTIVE';try{mode=b.mode()}catch(_){}if(mode==='FAST'){setText('SYSTEM WAKE','GAME STAR BOX','正在唤醒已配对硬件',true);setTimeout(()=>{try{b.startFast()}catch(_){}},180)}}
  boot();
})();
</script>
</body>
</html>
