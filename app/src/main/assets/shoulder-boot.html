<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;user-select:none;touch-action:none}

.internal{position:absolute;inset:0;opacity:.14;transition:.42s ease;filter:saturate(.8)}.root.cutaway .internal,.root.motion .internal,.root.touchStage .internal,.root.fanStage .internal,.root.finalStage .internal,.root.armed .internal{opacity:.88;filter:none}.pcb{position:absolute;left:10%;right:10%;top:10%;bottom:10%;border-radius:18px;background:linear-gradient(145deg,#18322b,#0b1d18);border:1px solid #315d4f;box-shadow:inset 0 0 0 3px rgba(110,187,151,.04)}.trace{position:absolute;height:2px;background:#7fb48f;opacity:.5;box-shadow:0 0 5px rgba(87,170,119,.3)}.trace.t1{left:12%;top:31%;width:26%}.trace.t2{left:60%;top:38%;width:23%}.trace.t3{left:26%;top:69%;width:46%}.trace.t4{left:39%;top:19%;width:22%;transform:rotate(90deg)}.chip{position:absolute;border-radius:7px;background:linear-gradient(145deg,#262d31,#080b0d);border:1px solid #485158;box-shadow:inset 0 0 0 2px rgba(255,255,255,.02),0 10px 22px rgba(0,0,0,.35);display:grid;place-items:center;color:#9aa7ae;font-size:6px;letter-spacing:.17em}.soc{left:42%;top:33%;width:17%;height:31%}.pmic{left:27%;top:24%;width:10%;height:16%}.storage{left:27%;top:55%;width:11%;height:13%}.motor{position:absolute;right:12%;bottom:14%;width:16%;height:17%;border-radius:12px;background:linear-gradient(180deg,#30363a,#111416);border:1px solid #6f777c;box-shadow:inset 0 0 0 2px #191c1f}.motor:before{content:"";position:absolute;left:12%;right:12%;top:29%;height:4px;border-radius:2px;background:#b88458;box-shadow:0 11px #b88458}.motor label,.fan label,.sensor label{position:absolute;font-size:5px;letter-spacing:.17em;color:#9eabb2;white-space:nowrap}.motor label{left:0;right:0;bottom:-16px;text-align:center}.fan{position:absolute;left:11%;bottom:12%;width:18%;aspect-ratio:1;border-radius:50%;border:1px solid #56616a;background:#080b0d;box-shadow:inset 0 0 0 8px #12171a}.fan label{left:0;right:0;bottom:-17px;text-align:center}.rotor{position:absolute;inset:10%;border-radius:50%;transform:rotate(var(--fan));will-change:transform}.blade{position:absolute;left:45%;top:7%;width:10%;height:43%;background:linear-gradient(180deg,#65747d,#202a30);border-radius:9px 9px 2px 2px;transform-origin:50% 100%}.blade:nth-child(2){transform:rotate(60deg)}.blade:nth-child(3){transform:rotate(120deg)}.blade:nth-child(4){transform:rotate(180deg)}.blade:nth-child(5){transform:rotate(240deg)}.blade:nth-child(6){transform:rotate(300deg)}.hub{position:absolute;left:40%;top:40%;width:20%;height:20%;border-radius:50%;background:#a7b2b8;border:2px solid #2a3034;z-index:3}
.sensor{position:absolute;top:3.5%;width:22%;height:10%;border:1px solid #59656d;border-radius:10px;background:linear-gradient(180deg,#252a2f,#101316);transition:.22s ease;box-shadow:0 8px 16px rgba(0,0,0,.38)}.sensor.left{left:8%}.sensor.right{right:8%}.sensor:after{content:"";position:absolute;left:11%;right:11%;bottom:7px;height:2px;background:#364048}.sensor.active{border-color:#83cef5;box-shadow:0 8px 16px rgba(0,0,0,.38),0 0 22px rgba(62,164,226,.24)}.sensor.active:after{background:#afeaff;box-shadow:0 0 12px #4cb8ff}.sensor.down{transform:translateY(5px) scaleY(.92)}.sensor label{bottom:-17px;left:0;right:0;text-align:center}.sensor .meter{position:absolute;left:10%;right:10%;top:47%;height:4px;border-radius:3px;background:#10171b;overflow:hidden}.sensor .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ca5ff,#bcf3ff);box-shadow:0 0 9px #5abaff;transition:width .05s linear}
.powerdots{position:absolute;right:4%;top:6%;display:flex;gap:7px;z-index:12}.powerdots i{width:5px;height:5px;border-radius:50%;background:#202a30;border:1px solid #43505a}.powerdots i.on{background:#b4efff;box-shadow:0 0 9px #57bfff}
.screenplay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none}.copy{text-align:center;transform:translateY(15%);text-shadow:0 2px 18px #000}.copy small{display:block;color:#70818d;font-size:7px;letter-spacing:.31em;margin-bottom:9px}.copy b{display:block;font-size:clamp(18px,2.35vw,34px);font-weight:650;letter-spacing:.12em}.copy p{margin:8px 0 0;color:#9ca8af;font-size:8px;letter-spacing:.14em}.gesture{position:absolute;inset:0;opacity:0;transition:.25s ease;pointer-events:none}.root.motion .motionViz,.root.touchStage .touchViz,.root.fanStage .fanViz,.root.finalStage .finalViz{opacity:1}.rail{position:absolute;left:18%;right:18%;top:49%;height:2px;background:linear-gradient(90deg,transparent,#6eb9e2 15%,#6eb9e2 85%,transparent);box-shadow:0 0 10px rgba(70,168,223,.45)}.probe{position:absolute;left:50%;top:calc(49% - 11px);width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,#e7fbff,#4b8fb8);border:1px solid #effcff;box-shadow:0 0 24px rgba(89,200,255,.7);transform:translateX(-50%);transition:left .05s linear}.target{position:absolute;top:calc(49% - 17px);width:5px;height:34px;background:#71d8ff;box-shadow:0 0 13px #4aa9ff}.target.l{left:22%}.target.r{right:22%}.target.hit{background:#fff;box-shadow:0 0 18px #fff}
.touchCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:.2s}.root.touchStage .touchCanvas{opacity:1;pointer-events:auto}.touchHint{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:6px;letter-spacing:.25em;color:#82909a}.wipeGlow{position:absolute;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,rgba(174,238,255,.2),rgba(84,175,255,.06) 38%,transparent 70%);opacity:0;pointer-events:none}
.fanViz{pointer-events:none}.root.fanStage .fanViz{pointer-events:auto}.fanStage .fan{box-shadow:inset 0 0 0 8px #12171a,0 0 34px rgba(68,170,231,.16)}.fanRing{position:absolute;left:11%;bottom:12%;width:18%;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(143,218,255,.45);transform:scale(1.22);opacity:0}.root.fanStage .fanRing{opacity:1;animation:ringPulse 1.1s ease-in-out infinite alternate}.air{position:absolute;left:23%;bottom:22%;width:22%;height:12%;opacity:0;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(112,208,255,.22) 7px 9px);mask-image:linear-gradient(90deg,#000,transparent);transform:skewX(-18deg)}.root.fanStage .air{opacity:1}.fanDragZone{position:absolute;left:6%;bottom:6%;width:28%;height:37%;border-radius:50%;pointer-events:auto}
.finalViz{pointer-events:none}.gripL,.gripR{position:absolute;top:12%;width:24%;height:34px;border-top:1px solid rgba(161,219,247,.5);opacity:.8}.gripL{left:8%;border-left:1px solid rgba(161,219,247,.5)}.gripR{right:8%;border-right:1px solid rgba(161,219,247,.5)}.finalStage .sensor{animation:readyPulse .8s ease-in-out infinite alternate}
.touchZone{position:absolute;top:-3%;width:38%;height:22%;z-index:50;pointer-events:none}.root.shoulderPlayable .touchZone{pointer-events:auto}.touchZone.left{left:1%}.touchZone.right{right:1%}
.brand{position:absolute;inset:0;display:grid;place-items:center;background:#000;opacity:0;pointer-events:none;z-index:70}.brand .inner{text-align:center}.brand .line{width:220px;height:1px;background:linear-gradient(90deg,transparent,#d8f7ff,transparent);margin:0 auto 19px;box-shadow:0 0 18px #78d6ff;transform:scaleX(0)}.brand b{font-size:clamp(26px,3.5vw,52px);letter-spacing:.23em;margin-right:-.23em;font-weight:650}.brand small{display:block;margin-top:11px;font-size:7px;letter-spacing:.34em;color:#687a85}.root.branding .brand{animation:brandIn .8s ease forwards}.root.branding .brand .line{animation:lineOn .5s .12s ease forwards}
.root.ignite .internal{opacity:1}.root.ignite .rotor{animation:fanFast .19s linear infinite}.root.ignite .pcb{animation:pcbFlash .95s ease forwards}.root.ignite .phone{animation:igniteShake .045s steps(2,end) infinite}.root.shellClose .internal{opacity:.08!important;transition:.2s ease}.root.shellClose .copy{opacity:0;transition:.13s ease}.root.shellClose .glass{animation:screenOn .38s ease forwards}
@keyframes readyPulse{to{filter:brightness(1.25);box-shadow:0 0 24px rgba(82,178,235,.26)}}@keyframes ringPulse{to{transform:scale(1.38);opacity:.25}}@keyframes fanFast{to{transform:rotate(360deg)}}@keyframes igniteShake{0%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}@keyframes pcbFlash{0%{filter:brightness(1)}55%{filter:brightness(2.15) saturate(1.5)}100%{filter:brightness(.8)}}@keyframes screenOn{0%{box-shadow:inset 0 0 70px rgba(57,125,171,.08)}40%{background:#eafaff;box-shadow:0 0 110px rgba(132,225,255,.8)}100%{background:#030608;box-shadow:inset 0 0 70px rgba(57,125,171,.08)}}@keyframes brandIn{0%{opacity:0}25%{opacity:1}100%{opacity:1}}@keyframes lineOn{to{transform:scaleX(1)}}
@media(max-height:520px){.stage{inset:5.5vh 4vw 6.5vh}.rig{height:min(66vh,420px)}.topbar{top:2.4vh}.copy{transform:translateY(10%)}}
</style>

<body>
<div class="root shoulderPlayable" id="root">
  <div class="topbar"><span><b>GAME STAR BOX</b> / HARDWARE PLAYGROUND</span><span class="chapter" id="chapter">CONTACT</span><span class="stepdots"><i class="on"></i><i></i><i></i><i></i><i></i></span></div>
  <div class="stage">
    <div class="rig" id="rig">
      <div class="phone">
        <div class="edge"><div class="glass" id="glass">
          <div class="internal">
            <div class="pcb"><i class="trace t1"></i><i class="trace t2"></i><i class="trace t3"></i><i class="trace t4"></i>
              <div class="chip soc">SOC</div><div class="chip pmic">PMIC</div><div class="chip storage">UFS</div>
              <div class="fan" id="fan"><div class="rotor" id="rotor"><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="hub"></i></div><label>THERMAL FAN MODEL</label></div>
              <div class="motor"><label>0815 LINEAR MOTOR</label></div>
              <div class="sensor left" id="leftSensor"><div class="meter"><i id="leftMeter"></i></div><label>CAPACITIVE SENSOR L</label></div>
              <div class="sensor right" id="rightSensor"><div class="meter"><i id="rightMeter"></i></div><label>CAPACITIVE SENSOR R</label></div>
            </div>
            <div class="powerdots"><i id="pCore"></i><i id="pLib"></i><i id="pSurface"></i></div>
          </div>
          <div class="screenplay"><div class="copy" id="copy"><small id="kicker">MAKE CONTACT</small><b id="title">LEFT SHOULDER</b><p id="sub">Touch the hardware. Let the machine answer.</p></div></div>
          <div class="gesture motionViz"><div class="rail"></div><i class="target l" id="targetL"></i><i class="target r" id="targetR"></i><div class="probe" id="probe"></div></div>
          <div class="gesture touchViz"><div class="touchHint">TRACE THE GLASS</div><div class="wipeGlow" id="wipeGlow"></div></div>
          <canvas class="touchCanvas" id="touchCanvas"></canvas>
          <div class="gesture fanViz"><div class="fanRing"></div><div class="air"></div><div class="fanDragZone" id="fanDrag"></div></div>
          <div class="gesture finalViz"><div class="gripL"></div><div class="gripR"></div></div>
        </div></div>
        <div class="touchZone left" id="leftTouch"></div><div class="touchZone right" id="rightTouch"></div>
      </div>
    </div>
  </div>
  <div class="brand"><div class="inner"><div class="line"></div><b>GAME STAR BOX</b><small>SYSTEM ONLINE</small></div></div>
</div>
<script>
(()=>{
 const root=document.getElementById('root'),rig=document.getElementById('rig'),chapter=document.getElementById('chapter');
 const leftSensor=document.getElementById('leftSensor'),rightSensor=document.getElementById('rightSensor');
 const leftMeter=document.getElementById('leftMeter'),rightMeter=document.getElementById('rightMeter');
 const kicker=document.getElementById('kicker'),title=document.getElementById('title'),sub=document.getElementById('sub');
 const dots=[...document.querySelectorAll('.stepdots i')];const probe=document.getElementById('probe'),targetL=document.getElementById('targetL'),targetR=document.getElementById('targetR');
 const canvas=document.getElementById('touchCanvas'),wipeGlow=document.getElementById('wipeGlow'),fanDrag=document.getElementById('fanDrag');
 const power={CORE_RUNTIME:document.getElementById('pCore'),GAME_CATALOG:document.getElementById('pLib'),MAIN_SURFACE:document.getElementById('pSurface')};
 let phase='',play='SHOULDERS',audio=null,motionStarted=false,motionBaseline=null,motionNeg=false,motionPos=false,dragTilt=0;
 let touchPath=0,touchLast=null,fanDegrees=0,fanLastAngle=null,fanPointer=false,visualDone=false,fast=false;
 function bridge(){return window.GSBShoulderBoot||null}
 function ac(){if(audio)return audio;try{audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(_){audio=null}return audio}
 function tone(a,b,d,g=.03,type='sine'){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(220,a),t);o.frequency.exponentialRampToValueAtTime(Math.max(220,b),t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.03)}
 function cue(n){if(n===1)tone(390,760,.08,.045,'triangle');else if(n===2)tone(560,980,.12,.035);else tone(720,1280,.15,.03)}
 function setCopy(k,t,s){kicker.textContent=k;title.textContent=t;sub.textContent=s}
 function step(n,name){dots.forEach((d,i)=>d.classList.toggle('on',i<=n));chapter.textContent=name}
 function setShoulder(side,down,progress,active){const s=side==='L'?leftSensor:rightSensor,m=side==='L'?leftMeter:rightMeter;s.classList.toggle('down',!!down);s.classList.toggle('active',!!active);m.style.width=`${Math.max(0,Math.min(100,progress||0))}%`}
 function bindShoulderZone(el,side){let held=false;const down=e=>{if(!root.classList.contains('shoulderPlayable'))return;e.preventDefault();held=true;try{ac()?.resume()}catch(_){};try{bridge()?.touch(side,true)}catch(_){}};const up=e=>{if(!held)return;e?.preventDefault();held=false;try{bridge()?.touch(side,false)}catch(_){}};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
 bindShoulderZone(document.getElementById('leftTouch'),'LEFT');bindShoulderZone(document.getElementById('rightTouch'),'RIGHT');
 function beginMotion(){if(play!=='SHOULDERS')return;play='MOTION';root.className='root motion';step(1,'MOTION');setCopy('MOVE THE MACHINE','FIND BOTH LIMITS','Tilt the phone. The internal probe is physically yours.');root.classList.remove('shoulderPlayable');motionStarted=true;cue(2);setTimeout(()=>{if(play==='MOTION'&&!motionNeg&&!motionPos)setCopy('MOVE THE MACHINE','TILT LEFT / RIGHT','Gyro first. Drag the device only if this WebView exposes no sensor stream.')},1200)}
 function applyTilt(v){v=Math.max(-1,Math.min(1,v));document.documentElement.style.setProperty('--ry',(v*10)+'deg');probe.style.left=(50+v*28)+'%';if(v<-.48){motionNeg=true;targetL.classList.add('hit');cue(1)}if(v>.48){motionPos=true;targetR.classList.add('hit');cue(1)}if(motionNeg&&motionPos)setTimeout(beginTouch,240)}
 window.addEventListener('deviceorientation',e=>{if(play!=='MOTION')return;const x=Number.isFinite(e.gamma)?e.gamma:(Number.isFinite(e.beta)?e.beta:0);if(motionBaseline===null)motionBaseline=x;applyTilt((x-motionBaseline)/18)});
 let rigDrag=false,rigX=0;rig.addEventListener('pointerdown',e=>{if(play==='MOTION'){rigDrag=true;rigX=e.clientX}});window.addEventListener('pointermove',e=>{if(play==='MOTION'&&rigDrag){dragTilt+=(e.clientX-rigX);rigX=e.clientX;applyTilt(dragTilt/130)}});window.addEventListener('pointerup',()=>rigDrag=false);
 function beginTouch(){if(play!=='MOTION')return;play='TOUCH';root.className='root touchStage';step(2,'TOUCH');setCopy('USE THE GLASS','WAKE THE DISPLAY LAYER','Draw across the dark glass. Reveal the machine underneath.');setupCanvas();cue(2)}
 function setupCanvas(){const r=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,r.width*dpr);canvas.height=Math.max(1,r.height*dpr);const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='source-over';c.fillStyle='rgba(7,12,17,.87)';c.fillRect(0,0,r.width,r.height);c.fillStyle='rgba(170,210,230,.05)';for(let y=0;y<r.height;y+=24)c.fillRect(0,y,r.width,1);touchPath=0;touchLast=null}
 function wipe(e){if(play!=='TOUCH')return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,c=canvas.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);c.save();c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='destination-out';const g=c.createRadialGradient(x,y,4,x,y,46);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,48,0,Math.PI*2);c.fill();c.restore();wipeGlow.style.left=(x-38)+'px';wipeGlow.style.top=(y-38)+'px';wipeGlow.style.opacity=1;if(touchLast){touchPath+=Math.hypot(x-touchLast.x,y-touchLast.y)}touchLast={x,y};if(touchPath>Math.min(r.width*1.45,720))setTimeout(beginFan,180)}
 let touching=false;canvas.addEventListener('pointerdown',e=>{touching=true;touchLast=null;wipe(e)});canvas.addEventListener('pointermove',e=>{if(touching)wipe(e)});canvas.addEventListener('pointerup',()=>{touching=false;touchLast=null});canvas.addEventListener('pointercancel',()=>{touching=false;touchLast=null});
 function beginFan(){if(play!=='TOUCH')return;play='FAN';root.className='root fanStage';step(3,'THERMAL');setCopy('SPIN THE COOLING MODEL','BUILD AIRFLOW','Drag around the rotor. Make the machine breathe.');cue(2);document.documentElement.style.setProperty('--fan',fanDegrees+'deg')}
 function fanAngle(e){const r=fanDrag.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
 fanDrag.addEventListener('pointerdown',e=>{if(play!=='FAN')return;fanPointer=true;fanLastAngle=fanAngle(e);e.preventDefault()});fanDrag.addEventListener('pointermove',e=>{if(!fanPointer||play!=='FAN')return;let a=fanAngle(e),d=a-fanLastAngle;if(d>180)d-=360;if(d<-180)d+=360;fanLastAngle=a;fanDegrees+=Math.abs(d)*1.35;document.documentElement.style.setProperty('--fan',fanDegrees+'deg');if(fanDegrees>620)setTimeout(beginFinal,160)});window.addEventListener('pointerup',()=>{fanPointer=false;fanLastAngle=null});
 function beginFinal(){if(play!=='FAN')return;play='FINAL';root.className='root finalStage shoulderPlayable';step(4,'IGNITION');setCopy('GRIP THE MACHINE','L + R','Hold both shoulders. Everything you touched comes online together.');cue(3)}
 function onState(s){if(!s)return;phase=s.phase||phase;setShoulder('L',s.leftDown,s.phase==='LEFT_HOLD'?s.progress:((s.leftCalibrated||['RIGHT_TAP','RIGHT_HOLD','BOTH_HOLD','ARMED','IGNITING','COMPLETE'].includes(s.phase))?100:0),!!(s.leftDown||s.leftCalibrated));setShoulder('R',s.rightDown,s.phase==='RIGHT_HOLD'?s.progress:((s.rightCalibrated||['BOTH_HOLD','ARMED','IGNITING','COMPLETE'].includes(s.phase))?100:0),!!(s.rightDown||s.rightCalibrated));
   if(fast)return;
   if(s.phase==='LEFT_TAP'&&play==='SHOULDERS'){root.className='root shoulderPlayable';step(0,'CONTACT');setCopy('MAKE CONTACT','LEFT SHOULDER','Touch the hardware. Let the machine answer.')}
   else if(s.phase==='LEFT_HOLD'&&play==='SHOULDERS'){root.className='root cutaway leftFocus shoulderPlayable';setCopy('SENSOR LINK','LEFT MODULE',`${s.progress||0}% // hold until the sensor locks`) }
   else if(s.phase==='RIGHT_TAP'&&play==='SHOULDERS'){root.className='root shoulderPlayable';setCopy('MODULE LOCKED','RIGHT SHOULDER','Wake the opposite control surface.');cue(2)}
   else if(s.phase==='RIGHT_HOLD'&&play==='SHOULDERS'){root.className='root cutaway rightFocus shoulderPlayable';setCopy('SENSOR LINK','RIGHT MODULE',`${s.progress||0}% // hold until the sensor locks`) }
   else if(s.phase==='BOTH_HOLD'&&play==='SHOULDERS'&&s.leftCalibrated&&s.rightCalibrated){beginMotion()}
   else if(s.phase==='BOTH_HOLD'&&play==='FINAL'){const p=s.progress||0;setCopy('IGNITION PRESS','L + R',`${p}% // hold the machine together`)}
   else if(s.phase==='ARMED'){play='ARMED';root.className='root armed';step(4,'SYSTEM SYNC');setCopy('HARDWARE COMPLETE','SYSTEM SYNC','First surface is finishing underneath this scene.');cue(3)}
   else if(s.phase==='IGNITING'){play='IGNITE';root.className='root ignite';setCopy('POWER ON','GAME STAR BOX','');cue(3);setTimeout(()=>root.classList.add('shellClose'),720);setTimeout(()=>{root.className='root branding';setTimeout(()=>{if(!visualDone){visualDone=true;try{bridge()?.visualComplete()}catch(_){}}},900)},1120)}
 }
 window.onGSBShoulderState=onState;
 window.onGSBProvisioningState=s=>{if(!s)return;const done=new Set(s.completed||[]);Object.entries(power).forEach(([k,v])=>v.classList.toggle('on',done.has(k)))};
 document.addEventListener('DOMContentLoaded',()=>{let b=bridge();try{fast=b&&b.mode&&b.mode()==='FAST'}catch(_){fast=false}try{b&&b.ready&&b.ready()}catch(_){}if(fast){root.className='root armed';setCopy('SYSTEM','WAKE','');setTimeout(()=>{try{b&&b.startFast&&b.startFast()}catch(_){}},90)}});
})();
</script>
