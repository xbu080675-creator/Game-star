<div class="root shoulderPlayable" id="root">
 <div class="grain"></div>

 <div class="world"><div class="camera" id="camera"><div class="device"><div class="frame"><div class="glass" id="glass">
   <div class="internals"><div class="pcb"><i class="lane l1"></i><i class="lane l2"></i><i class="lane l3"></i><i class="lane l4"></i><div class="chip soc">SOC</div><div class="chip pmic">PMIC</div><div class="chip ufs">UFS</div><div class="fan" id="fan"><div class="rotor"><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="blade"></i><i class="hub"></i></div><span class="hwlabel">THERMAL FAN MODEL</span></div><div class="motor"><span class="hwlabel">0815 LINEAR MOTOR</span></div><div class="powerRail"></div></div>
    <div class="shoulder left" id="leftShoulder"><div class="meter"><i id="leftMeter"></i></div><em>CAPACITIVE L</em></div><div class="shoulder right" id="rightShoulder"><div class="meter"><i id="rightMeter"></i></div><em>CAPACITIVE R</em></div><div class="powerdots"><i id="pCore"></i><i id="pLib"></i><i id="pSurface"></i></div>

</div>
<script>
