<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Game Star Box · 竞界</title>
<style>
:root{--bg:#0b1721;--bg2:#111f2a;--panel:#172733;--panel2:#1c2e3c;--line:rgba(211,232,247,.14);--text:#f4f7fa;--muted:#9cacb9;--dim:#637481;--cyan:#7adfff;--green:#62e6a8;--red:#ff6d75;--shadow:0 16px 42px rgba(0,0,0,.34);--ease:cubic-bezier(.2,.82,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071017;color:var(--text);font-family:"Segoe UI","PingFang SC",system-ui,sans-serif}body{overscroll-behavior:none;user-select:none;touch-action:none}button{font:inherit;color:inherit}button:focus{outline:none}
.shell{position:relative;width:100vw;height:100vh;overflow:hidden;background:#08131c}
.gameBackdrop{position:absolute;inset:-38px;z-index:0;background-position:center;background-size:cover;filter:blur(32px) saturate(1.08) brightness(.56);transform:scale(1.10);opacity:.82;transition:background-image .34s var(--ease),filter .34s var(--ease),opacity .34s ease;will-change:background-image,filter}.gameBackdrop:after{content:"";position:absolute;inset:-2px;background:linear-gradient(180deg,rgba(5,13,19,.40) 0%,rgba(7,17,24,.58) 46%,rgba(6,14,21,.76) 100%),linear-gradient(90deg,rgba(5,12,18,.44),transparent 28%,transparent 72%,rgba(5,12,18,.28))}.shell:after{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 15%,transparent 82%,rgba(0,0,0,.18));mix-blend-mode:screen}
.topbar{height:54px;position:relative;z-index:20;display:grid;grid-template-columns:260px 1fr 330px;align-items:center;padding:0 22px;background:rgba(9,18,25,.9);border-bottom:1px solid rgba(220,240,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.11)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(176,209,232,.32);background:#101e29;font-size:11px;font-weight:850;letter-spacing:-.03em;clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%)}.brand b{font-size:11px;letter-spacing:.23em;white-space:nowrap}.brand small{display:block;margin-top:2px;font-size:6px;letter-spacing:.18em;color:#6f808e}.tabs{height:100%;display:flex;align-items:stretch;justify-content:center;gap:24px}.tab{position:relative;border:0;background:transparent;color:#83929f;padding:0 2px;font-size:10px;font-weight:700;cursor:pointer;transition:color .18s var(--ease)}.tab.active{color:#fff}.tab.active:after{content:"";position:absolute;height:2px;left:0;right:0;bottom:0;background:#e9f8ff;box-shadow:0 0 10px rgba(122,223,255,.7)}
.status{justify-self:end;display:flex;align-items:center;gap:15px;color:#8798a6;font-size:9px}.status .online{color:#b5f4d4}.statusDot{display:inline-block;width:6px;height:6px;margin-right:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px rgba(98,230,168,.55)}
.stage{position:relative;z-index:3;height:calc(100vh - 84px);overflow:hidden;touch-action:none}.scene{position:absolute;inset:0;padding:14px 22px 12px;opacity:0;transform:translateY(10px) scale(.995);pointer-events:none;transition:opacity .22s var(--ease),transform .27s var(--ease)}.scene.active{opacity:1;transform:none;pointer-events:auto}
.homeScene{display:grid;grid-template-rows:minmax(220px,1.15fr) minmax(126px,.58fr) minmax(92px,.42fr);gap:12px}.sectionLabel{height:20px;display:flex;align-items:center;justify-content:space-between;color:#d7e0e7}.sectionLabel b{font-size:11px}.sectionLabel span{font-size:7px;color:#728391;letter-spacing:.12em}
.heroWrap{position:relative;min-height:0;overflow:hidden}.heroAura{position:absolute;inset:-28% -8% 0;opacity:.42;filter:blur(38px);pointer-events:none;background:radial-gradient(circle at var(--aura-x,26%) 35%,var(--aura,rgba(88,166,222,.38)),transparent 26%);transition:background .35s var(--ease),opacity .35s var(--ease)}
.carousel{position:relative;height:100%;display:flex;align-items:stretch;gap:10px;overflow:hidden;padding:1px 1px 7px;touch-action:none}.gameCard{position:relative;min-width:0;flex:0 1 10.8%;border:1px solid rgba(198,224,243,.11);background:#152733;overflow:hidden;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.16);transform:translateY(5px) scale(.985);filter:saturate(.78) brightness(.86);transition:flex-basis .28s var(--ease),transform .23s var(--ease),filter .2s ease,border-color .18s ease,box-shadow .23s var(--ease)}.gameCard.active{flex-basis:42%;transform:translateY(0) scale(1);filter:none;border-color:rgba(226,245,255,.72);box-shadow:0 14px 34px rgba(0,0,0,.34),inset 0 -3px 0 #eefaff}.gameCard:active{transform:scale(.985)}
.art{position:absolute;inset:0;transition:transform .46s var(--ease),filter .22s ease}.gameCard.active .art{transform:scale(1.025)}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 28%,rgba(4,10,14,.06) 43%,rgba(4,9,13,.88) 100%)}
.cardTop{position:absolute;top:11px;left:12px;z-index:3;font-size:6px;letter-spacing:.15em;color:rgba(235,246,252,.72);opacity:0;transform:translateY(-3px);transition:.18s ease}.gameCard.active .cardTop{opacity:1;transform:none}.cardInfo{position:absolute;left:13px;right:13px;bottom:11px;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.5)}.cardInfo b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardInfo small{display:block;margin-top:3px;color:#98a9b6;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gameCard.active .cardInfo{left:20px;bottom:18px;max-width:65%}.gameCard.active .cardInfo b{font-size:clamp(22px,3vw,42px);letter-spacing:-.035em;line-height:.95}.gameCard.active .cardInfo small{font-size:9px;margin-top:6px;color:#c2ccd3}.playBtn{position:absolute;z-index:4;right:18px;bottom:17px;height:34px;padding:0 13px;border:0;border-radius:4px;background:#f5f8fa;color:#081016;font-weight:800;font-size:9px;opacity:0;transform:translateY(6px);transition:.19s var(--ease);cursor:pointer}.gameCard.active .playBtn{opacity:1;transform:none}
.rows{min-height:0;display:grid;grid-template-rows:20px minmax(0,1fr)}.rowGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.activity{position:relative;min-width:0;border:1px solid rgba(203,226,242,.1);background:rgba(22,38,49,.8);padding:12px 13px;overflow:hidden;transition:transform .19s var(--ease),border-color .19s ease,background .19s ease}.activity:hover,.activity.focused{transform:translateY(-2px);border-color:rgba(218,239,252,.36);background:#1c3140}.activity:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,#6da9df)}.activity b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity small{display:block;font-size:7px;color:#718391;margin-top:5px}.activity strong{position:absolute;right:12px;bottom:9px;font-size:15px}.serviceGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.service{position:relative;border:1px solid rgba(203,226,242,.09);background:#12222d;padding:10px 11px;overflow:hidden}.service b{font-size:9px}.service small{display:block;margin-top:4px;color:#6f8190;font-size:7px}.service i{position:absolute;right:9px;top:10px;font-style:normal;color:#80dfff;font-size:8px}
/* existing remaining styles preserved by repository baseline */
</style>
</head>
<body>
<!-- UI markup preserved by repository baseline -->
<audio id="bootAudio" preload="auto" src="fairy_boot.ogg"></audio>
<script>
const boot=document.getElementById('boot'),bootAudio=document.getElementById('bootAudio'),overlay=document.getElementById('overlay');
const scenes=[...document.querySelectorAll('.scene')],tabs=[...document.querySelectorAll('.tab')],cards=[...document.querySelectorAll('.gameCard')],aura=document.getElementById('heroAura'),gameBackdrop=document.getElementById('gameBackdrop');let selected=0,currentScene='home';
const BOOT_TIMELINE_SECONDS=4.02;
function nativeHaptic(cue){try{if(window.GSBNative&&GSBNative.haptic)GSBNative.haptic(cue)}catch(e){}}
function updateBackdrop(i){const art=cards[i]?.querySelector('.art');if(!art||!gameBackdrop)return;const cs=getComputedStyle(art);gameBackdrop.style.backgroundImage=cs.backgroundImage;gameBackdrop.style.backgroundColor=cs.backgroundColor;gameBackdrop.style.backgroundPosition=cs.backgroundPosition||'center';gameBackdrop.style.backgroundSize='cover'}
function prepareBootAnimations(){if(!Element.prototype.getAnimations)return[];boot.classList.add('go');void boot.offsetWidth;const list=[];for(const sel of ['.bootAmbient','.trace','.energy','.arcA','.arcB','.logoStar','.logoDiamond','.word']){const el=boot.querySelector(sel);if(!el||!el.getAnimations)continue;for(const a of el.getAnimations()){try{a.pause();a.currentTime=0;list.push(a)}catch(e){}}}if(!list.length)boot.classList.remove('go');return list}
function runBootTimeline(animations,audioMaster){let tick=false,click=false;const fallbackStart=performance.now();const durationAtStart=Number.isFinite(bootAudio.duration)&&bootAudio.duration>.5?bootAudio.duration:BOOT_TIMELINE_SECONDS;const audioScale=BOOT_TIMELINE_SECONDS/durationAtStart;const sync=()=>{if(boot.classList.contains('done'))return;let t;if(audioMaster&&bootAudio.ended){t=BOOT_TIMELINE_SECONDS}else if(audioMaster&&!bootAudio.paused&&Number.isFinite(bootAudio.currentTime)){t=Math.min(BOOT_TIMELINE_SECONDS,bootAudio.currentTime*audioScale)}else{t=Math.min(BOOT_TIMELINE_SECONDS,(performance.now()-fallbackStart)/1000)}if(animations.length){const ms=t*1000;for(const a of animations){try{a.currentTime=ms}catch(e){}}}if(!tick&&t>=.38){tick=true;nativeHaptic('tick')}if(!click&&t>=2.53){click=true;nativeHaptic('click')}if(t>=BOOT_TIMELINE_SECONDS){boot.classList.add('done');return}requestAnimationFrame(sync)};requestAnimationFrame(sync)}
window.addEventListener('load',()=>{updateBackdrop(0);bootAudio.volume=.72;bootAudio.currentTime=0;const animations=prepareBootAnimations();let started=false;const begin=(audioMaster)=>{if(started)return;started=true;if(!animations.length)boot.classList.add('go');runBootTimeline(animations,audioMaster)};bootAudio.addEventListener('playing',()=>begin(true),{once:true});bootAudio.addEventListener('error',()=>begin(false),{once:true});try{const p=bootAudio.play();if(p&&p.catch)p.catch(()=>begin(false))}catch(e){begin(false)}setTimeout(()=>{if(started)return;try{bootAudio.pause();bootAudio.currentTime=0}catch(e){}begin(false)},1800)});
class UISound{constructor(){this.ctx=null}ensure(){if(!this.ctx){this.ctx=new(window.AudioContext||window.webkitAudioContext)()}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx}tone(f1,f2,d,g=.03,type='sine'){const c=this.ensure(),o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),c.currentTime+d);a.gain.setValueAtTime(.0001,c.currentTime);a.gain.exponentialRampToValueAtTime(g,c.currentTime+.006);a.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(a).connect(c.destination);o.start();o.stop(c.currentTime+d+.01)}focus(){this.tone(690,810,.045,.018);this.tone(1380,1580,.036,.008)}confirm(){this.tone(170,112,.075,.035,'triangle');this.tone(980,720,.045,.018)}back(){this.tone(520,330,.06,.02)}open(){this.tone(260,185,.08,.022,'triangle');this.tone(760,940,.065,.012)}}const sfx=new UISound();document.addEventListener('pointerdown',()=>sfx.ensure(),{once:true});
function selectCard(i,withSound=true){if(!cards.length)return;i=(i+cards.length)%cards.length;if(i===selected)return;cards[selected]?.classList.remove('active');selected=i;cards[selected]?.classList.add('active');aura?.style.setProperty('--aura',cards[selected]?.dataset.aura||'rgba(88,166,222,.42)');aura?.style.setProperty('--aura-x',`${20+selected*13}%`);updateBackdrop(selected);if(withSound)sfx.focus()}
cards.forEach((c,i)=>c.addEventListener('click',()=>{if(i!==selected)selectCard(i);else{sfx.confirm()}}));
function showScene(name,withSound=true){if(name===currentScene)return;currentScene=name;scenes.forEach(s=>s.classList.toggle('active',s.dataset.scene===name));tabs.forEach(t=>t.classList.toggle('active',t.dataset.scene===name));if(withSound)sfx.focus()}
tabs.forEach(t=>t.addEventListener('click',()=>showScene(t.dataset.scene)));
function openQuick(){overlay?.classList.add('open');sfx.open()}function closeQuick(play=true){if(!overlay?.classList.contains('open'))return;overlay.classList.remove('open');if(play)sfx.back()}
document.getElementById('close')?.addEventListener('click',()=>closeQuick());overlay?.addEventListener('click',e=>{if(e.target===overlay)closeQuick()});
document.querySelectorAll('.switch,.qBtn').forEach(b=>{if(b.id==='hapticTest'||b.id==='quickHaptic')return;b.addEventListener('click',()=>{b.classList.toggle('on');sfx.confirm()})});
for(const id of ['hapticTest','quickHaptic']){const el=document.getElementById(id);if(el)el.onclick=()=>{nativeHaptic('click');sfx.confirm()}}
function sceneIndex(){return ['home','library','esports','system'].indexOf(currentScene)}
function moveScene(delta){let i=sceneIndex();if(i<0)i=0;i=(i+delta+4)%4;showScene(['home','library','esports','system'][i])}
let gesture=null;
function interactiveTarget(target){return !!target?.closest?.('button,.switch,.qBtn,.playBtn,.tab,input,a,[data-no-swipe]')}
window.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(boot&&!boot.classList.contains('done'))return;if(overlay?.classList.contains('open'))return;if(interactiveTarget(e.target))return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),target:e.target};try{e.target.setPointerCapture?.(e.pointerId)}catch(_){}} ,{passive:true});
window.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=Math.max(1,performance.now()-g.t);const ax=Math.abs(dx),ay=Math.abs(dy);if(Math.max(ax,ay)<42||dt>900)return;if(currentScene==='home'&&g.target?.closest?.('#carousel,.heroWrap')&&ax>ay*1.15){selectCard(selected+(dx<0?1:-1));e.preventDefault();return}if(ay>ax*1.15){moveScene(dy<0?1:-1);e.preventDefault()}},{passive:false});
window.addEventListener('pointercancel',()=>{gesture=null},{passive:true});
window.addEventListener('keydown',e=>{if(boot&&!boot.classList.contains('done'))return;const k=e.key.toLowerCase();if(overlay?.classList.contains('open')){if(e.key==='Escape'||k==='b'){closeQuick();e.preventDefault()}return}if(k==='x'){openQuick();e.preventDefault();return}if(e.key==='Escape'||k==='b'){sfx.back();e.preventDefault();return}if(currentScene==='home'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){selectCard(selected+(e.key==='ArrowRight'?1:-1));e.preventDefault();return}if(e.key==='ArrowUp'||e.key==='ArrowDown'){moveScene(e.key==='ArrowDown'?1:-1);e.preventDefault();return}if(e.key==='Enter'||k==='a'){sfx.confirm();e.preventDefault()}});
</script>
</body></html>
