plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xbu.esportscenter'
    compileSdk 35

    def fixedStore = System.getenv('GSB_DEV_KEYSTORE')

    defaultConfig {
        applicationId "com.xbu.esportscenter"
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName "0.4.24"
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    signingConfigs {
        if (fixedStore != null && !fixedStore.isBlank()) {
            gsbDev {
                storeFile file(fixedStore)
                storePassword System.getenv('GSB_DEV_STORE_PASSWORD')
                keyAlias System.getenv('GSB_DEV_KEY_ALIAS')
                keyPassword System.getenv('GSB_DEV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (signingConfigs.findByName('gsbDev') != null) {
                signingConfig signingConfigs.gsbDev
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('gsbDev') != null) {
                signingConfig signingConfigs.gsbDev
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'

    def shizukuVersion = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizukuVersion"
    implementation "dev.rikka.shizuku:provider:$shizukuVersion"
}
