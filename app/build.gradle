plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xbu.esportscenter'
    compileSdk 35

    defaultConfig {
        applicationId "com.xbu.esportscenter"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "0.3.7"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
