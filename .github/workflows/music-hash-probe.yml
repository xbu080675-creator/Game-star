name: Probe CC0 Menu Music

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/music-hash-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Spacelife 14 from OpenGameArt
        shell: bash
        run: |
          set -euo pipefail
          URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/spacelifeNo14.ogg
          test -s /tmp/spacelifeNo14.ogg
          echo "size=$(stat -c '%s' /tmp/spacelifeNo14.ogg)"
          echo "sha256=$(sha256sum /tmp/spacelifeNo14.ogg | awk '{print $1}')"
          file /tmp/spacelifeNo14.ogg
