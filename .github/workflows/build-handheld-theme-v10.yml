name: Build Handheld Home Theme v10

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -

      - name: Guard handheld theme contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='app/src/main/assets/handheld-theme.css'
          JS='app/src/main/assets/theme-runtime.js'
          HYDRATE='app/src/main/assets/native-update.js'
          DOC='docs/HANDHELD_HOME_THEME_0.4.27.md'
          test -f "$CSS" -a -f "$JS" -a -f "$HYDRATE" -a -f "$DOC"
          grep -q 'data-gsb-theme="handheld"' "$CSS"
          grep -q 'gsb.ui.theme.v10' "$JS"
          grep -q "return 'handheld'" "$JS"
          grep -q 'gsbThemeToggle' "$JS"
          grep -q 'hhDock' "$JS"
          grep -q "showScene('library')" "$JS"
          grep -q "showScene('esports')" "$JS"
          grep -q 'GSBTheme' "$JS"
          grep -q 'gsb-handheld-theme-css' "$HYDRATE"
          grep -q 'gsb-theme-runtime-js' "$HYDRATE"
          grep -q "handheld-theme.css" "$HYDRATE"
          grep -q "theme-runtime.js" "$HYDRATE"
          node --check "$JS"
          node --check "$HYDRATE"
          if grep -Eqi 'mario|zelda|splatoon|pikmin|animal[ _-]crossing|metroid' "$CSS" "$JS"; then
            echo 'Nintendo proprietary game identity/content leaked into theme runtime' >&2
            exit 1
          fi
          if grep -Eqi 'Settings\.(Global|Secure|System)\.put|ProcessBuilder|Runtime\.getRuntime|rikka\.shizuku' "$JS"; then
            echo 'Theme runtime must remain presentation-only' >&2
            exit 1
          fi

      - name: Guard Core playground gate regression
        shell: bash
        run: |
          set -euo pipefail
          GATE='app/src/main/java/com/xbu/esportscenter/core/boot/IgnitionGate.java'
          SHOULDER='app/src/main/java/com/xbu/esportscenter/core/boot/ShoulderBootStateMachine.java'
          grep -q 'hardwareReady && playgroundReady && provisioningReady' "$GATE"
          grep -q 'freshBothRequired' "$SHOULDER"
          if grep -R -Eqi 'android\.|rikka\.shizuku|Settings\.|ProcessBuilder|Runtime\.getRuntime|/system/bin|/sys/' app/src/main/java/com/xbu/esportscenter/core; then
            echo 'Platform API leaked into Core' >&2
            exit 1
          fi

      - name: Validate model event contract
        run: gradle :app:validateHardwareModelPack --stacktrace

      - name: Run Core unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile signed v10 APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK='out/Game-Star-Box-0.4.27-handheld-theme-v10.apk'
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          unzip -l "$APK" | grep 'assets/handheld-theme.css'
          unzip -l "$APK" | grep 'assets/theme-runtime.js'
          unzip -p "$APK" assets/native-update.js | grep -q 'gsb-theme-runtime-js'
          unzip -l "$APK" | grep 'assets/hardware-model/model-manifest.json'
          sha256sum "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-handheld-theme-v10
          path: out/Game-Star-Box-0.4.27-handheld-theme-v10.apk
          if-no-files-found: error
          retention-days: 3
