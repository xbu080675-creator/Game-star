name: Build Shoulder Scene Hotfix

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -

      - name: Guard REDMAGIC shoulder calibration privilege surface
        shell: bash
        run: |
          set -euo pipefail
          SERVICE='app/src/main/java/com/xbu/esportscenter/privileged/RedMagicShoulderReaderService.java'
          ADAPTER='app/src/main/java/com/xbu/esportscenter/privileged/RedMagicShoulderPrivilegedAdapter.java'
          AIDL='app/src/main/aidl/com/xbu/esportscenter/privileged/IRedMagicShoulderReader.aidl'
          test -f "$SERVICE" -a -f "$ADAPTER" -a -f "$AIDL"
          grep -q '"/system/bin/getevent"' "$SERVICE"
          grep -q '"/system/bin/settings"' "$SERVICE"
          grep -q 'nubia_game_scene' "$SERVICE"
          grep -q 'nubia_game_mode' "$SERVICE"
          grep -q 'cc_game_mis_operate' "$SERVICE"
          grep -q 'KEY_F7' "$SERVICE"
          grep -q 'KEY_F8' "$SERVICE"
          grep -q 'enableCalibrationScene' "$AIDL"
          grep -q 'restoreCalibrationScene' "$AIDL"
          if grep -Eqi 'virtual_game_key|WRITE_SECURE_SETTINGS|sendevent|uinput|input[[:space:]]+(keyevent|motionevent)|sh[[:space:]]+-c|runShell|execCommand|String command' "$SERVICE" "$ADAPTER" "$AIDL"; then
            echo 'Shoulder calibration privilege surface expanded beyond typed reversible contract' >&2
            exit 1
          fi
          ALLOWED='nubia_game_scene|nubia_game_mode|cc_game_mis_operate'
          if grep -oE 'nubia_[a-zA-Z0-9_]+|cc_game_[a-zA-Z0-9_]+' "$SERVICE" | grep -Ev "^(${ALLOWED})$"; then
            echo 'Unexpected REDMAGIC setting key found in privileged service' >&2
            exit 1
          fi

      - name: Compile signed hotfix APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Game-Star-Box-0.4.27-redmagic-shoulder-scene-hotfix.apk
          sha256sum Game-Star-Box-0.4.27-redmagic-shoulder-scene-hotfix.apk

      - name: Upload hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-redmagic-shoulder-scene-hotfix
          path: Game-Star-Box-0.4.27-redmagic-shoulder-scene-hotfix.apk
          if-no-files-found: error
          retention-days: 3
