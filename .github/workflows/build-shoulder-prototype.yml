name: Build Shoulder Boot Prototype

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -

      - name: Guard REDMAGIC shoulder privilege surface
        shell: bash
        run: |
          set -euo pipefail
          SERVICE='app/src/main/java/com/xbu/esportscenter/privileged/RedMagicShoulderReaderService.java'
          ADAPTER='app/src/main/java/com/xbu/esportscenter/privileged/RedMagicShoulderPrivilegedAdapter.java'
          AIDL='app/src/main/aidl/com/xbu/esportscenter/privileged/IRedMagicShoulderReader.aidl'
          CALLBACK='app/src/main/aidl/com/xbu/esportscenter/privileged/IRedMagicShoulderCallback.aidl'
          test -f "$SERVICE" -a -f "$ADAPTER" -a -f "$AIDL" -a -f "$CALLBACK"

          # Positive contract: fixed getevent executable, internally validated REDMAGIC SAR,
          # and exactly the two evidence-backed shoulder key semantics.
          grep -Fq 'private static final String GETEVENT = "/system/bin/getevent"' "$SERVICE"
          grep -Fq 'new ProcessBuilder(GETEVENT, "-pl")' "$SERVICE"
          grep -Fq 'new ProcessBuilder(GETEVENT, "-ql", device)' "$SERVICE"
          grep -Fq 'EVENT_PATH.matcher(path).matches()' "$SERVICE"
          grep -Fq 'nubia_tgk_aw_sar' "$SERVICE"
          grep -Fq 'KEY_F7' "$SERVICE"
          grep -Fq 'KEY_F8' "$SERVICE"

          # AIDL must stay typed: callers cannot supply shell commands, device paths or key names.
          if grep -Eqi '(String[[:space:]]+(command|path|device|key)|startReading\([^)]*String|stopReading\([^)]*String)' "$AIDL" "$CALLBACK"; then
            echo 'Shoulder AIDL accepts forbidden free-form privileged input' >&2
            exit 1
          fi

          # Executable-code guard. Match actual APIs/string literals rather than documentation words.
          if grep -Eqi 'Settings\.(Global|Secure|System)\.put|runShell[[:space:]]*\(|execCommand[[:space:]]*\(|"/dev/uinput"|"/system/bin/sendevent"|"/system/bin/input"' "$SERVICE" "$ADAPTER"; then
            echo 'Shoulder reader privilege surface expanded beyond read-only contract' >&2
            exit 1
          fi
          if grep -Eqi 'new[[:space:]]+ProcessBuilder\([^;]*("sh"|"/system/bin/sh")[^;]*"-c"' "$SERVICE" "$ADAPTER"; then
            echo 'Dynamic shell execution is forbidden in shoulder reader' >&2
            exit 1
          fi

      - name: Compile signed prototype APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Game-Star-Box-0.4.27-redmagic-shoulder-prototype.apk
          sha256sum Game-Star-Box-0.4.27-redmagic-shoulder-prototype.apk

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-redmagic-shoulder-prototype
          path: Game-Star-Box-0.4.27-redmagic-shoulder-prototype.apk
          if-no-files-found: error
          retention-days: 3
