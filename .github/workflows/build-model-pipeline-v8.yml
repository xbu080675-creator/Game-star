name: Build Hardware Model Pipeline v8

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -

      - name: Guard v8 model pipeline contract
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER='app/src/main/java/com/xbu/esportscenter/platform/android/HardwareModelAssetAdapter.java'
          MANIFEST='app/src/main/assets/hardware-model/model-manifest.json'
          README='app/src/main/assets/hardware-model/README.md'
          SOURCE='art/model-source/README.md'
          BOOT='app/src/main/java/com/xbu/esportscenter/BootMainActivity.java'
          PROVIDER='app/src/main/java/com/xbu/esportscenter/privileged/RedMagicShoulderBootstrapProvider.java'
          test -f "$ADAPTER" -a -f "$MANIFEST" -a -f "$README" -a -f "$SOURCE"
          grep -q 'HardwareModelAssetAdapter' "$BOOT"
          grep -q 'hardware_playground_model_pipeline_migration_0427_v8' "$PROVIDER"
          grep -q 'productionReady.*false' "$MANIFEST"
          grep -q 'GSB-MODEL-PRODUCTION-VECTOR-FORBIDDEN' "$ADAPTER"
          grep -q 'GSB-MODEL-PACK-INCOMPLETE' "$ADAPTER"
          grep -q 'hardware-model/render-v8' "$MANIFEST"
          test "$(grep -c '"logicalRequest"' "$MANIFEST")" = '8'
          if grep -E '"renderPath"[[:space:]]*:[[:space:]]*"[^"]+\.svg"' "$MANIFEST"; then
            echo 'Production model render paths may not be SVG' >&2
            exit 1
          fi

      - name: Validate model pack through Gradle
        run: gradle :app:validateHardwareModelPack --stacktrace

      - name: Compile signed v8 pipeline APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Game-Star-Box-0.4.27-model-pipeline-v8.apk
          unzip -l out/Game-Star-Box-0.4.27-model-pipeline-v8.apk | grep 'assets/hardware-model/model-manifest.json'
          unzip -l out/Game-Star-Box-0.4.27-model-pipeline-v8.apk | grep 'assets/hardware-v7/chassis-shell.svg'
          sha256sum out/Game-Star-Box-0.4.27-model-pipeline-v8.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-model-pipeline-v8
          path: out/Game-Star-Box-0.4.27-model-pipeline-v8.apk
          if-no-files-found: error
          retention-days: 3
