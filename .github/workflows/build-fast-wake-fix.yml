name: Build FAST Wake Fix v10.2

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"
      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -
      - name: Guard FAST wake presentation
        shell: bash
        run: |
          set -euo pipefail
          HTML='app/src/main/assets/shoulder-boot.html'
          grep -q "Game Star Box Hardware Playground v10.2" "$HTML"
          grep -q "if(fast&&s.phase!=='ARMED'&&s.phase!=='IGNITING')return" "$HTML"
          grep -q "s.phase==='ARMED'&&play!=='ARMED'" "$HTML"
          grep -q "s.phase==='IGNITING'&&play!=='IGNITE'" "$HTML"
          if grep -q "if(fast)return" "$HTML"; then
            echo 'legacy FAST terminal-state swallow still present' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/shoulder-boot.html').read_text()
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          p=Path(tempfile.gettempdir())/'gsb-shoulder-fast-check.js'
          p.write_text(js)
          subprocess.check_call(['node','--check',str(p)])
          PY
      - name: Guard Thermal rotor regression
        shell: bash
        run: |
          set -euo pipefail
          HTML='app/src/main/assets/shoulder-boot.html'
          grep -q 'setPointerCapture' "$HTML"
          grep -q 'airflowWork' "$HTML"
          ! grep -q 'fanDegrees>660' "$HTML"
      - name: Guard Core playground gate regression
        shell: bash
        run: |
          set -euo pipefail
          GATE='app/src/main/java/com/xbu/esportscenter/core/boot/IgnitionGate.java'
          SHOULDER='app/src/main/java/com/xbu/esportscenter/core/boot/ShoulderBootStateMachine.java'
          grep -q 'hardwareReady && playgroundReady && provisioningReady' "$GATE"
          grep -q 'startFastArmed' "$SHOULDER"
          grep -q 'freshBothRequired' "$SHOULDER"
      - name: Validate model event contract
        run: gradle :app:validateHardwareModelPack --stacktrace
      - name: Run Core unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compile signed FAST wake fix APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK='out/Game-Star-Box-0.4.27-fast-wake-fix-v10.2.apk'
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          unzip -p "$APK" assets/shoulder-boot.html | grep -q "v10.2"
          unzip -p "$APK" assets/shoulder-boot.html | grep -q "if(fast&&s.phase!=='ARMED'&&s.phase!=='IGNITING')return"
          sha256sum "$APK"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-fast-wake-fix-v10.2
          path: out/Game-Star-Box-0.4.27-fast-wake-fix-v10.2.apk
          if-no-files-found: error
          retention-days: 3
