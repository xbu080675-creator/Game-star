name: Build Hardware Asset Rebuild v7

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -

      - name: Guard v7 asset rebuild contract
        shell: bash
        run: |
          set -euo pipefail
          BOOT='app/src/main/assets/shoulder-boot.html'
          ASSET_DIR='app/src/main/assets/hardware-v7'
          PROVIDER='app/src/main/java/com/xbu/esportscenter/privileged/RedMagicShoulderBootstrapProvider.java'
          MOTION='app/src/main/java/com/xbu/esportscenter/platform/android/HardwarePlaygroundMotionAdapter.java'
          HAPTIC='app/src/main/java/com/xbu/esportscenter/platform/android/HardwarePlaygroundHapticAdapter.java'
          MOTOR='app/src/main/java/com/xbu/esportscenter/platform/android/HardwareAwakeningMotorDriver.java'
          MANIFEST='app/src/main/AndroidManifest.xml'
          for f in chassis-shell.svg pcb-board.svg cooling-fan.svg linear-motor.svg mechanism-detent.svg mechanism-ratchet.svg mechanism-latch.svg maintenance-core.svg; do
            test -s "$ASSET_DIR/$f"
            grep -q "hardware-v7/$f" "$BOOT" || { echo "asset not referenced: $f" >&2; exit 1; }
          done
          grep -q 'hardware_playground_asset_rebuild_migration_0427_v7' "$PROVIDER"
          grep -q 'TYPE_GAME_ROTATION_VECTOR' "$MOTION"
          grep -q 'VibratorManager' "$HAPTIC"
          grep -q 'VibratorManager' "$MOTOR"
          grep -q 'android.permission.VIBRATE' "$MANIFEST"
          grep -q 'mechanicalObject detent' "$BOOT"
          grep -q 'mechanicalObject ratchet' "$BOOT"
          grep -q 'mechanicalObject latch' "$BOOT"
          grep -q 'powerRail' "$BOOT"
          if grep -Eq 'startHum\(|humGain|frequency\.value=4[0-9]|tone\((58|74|96),' "$BOOT"; then
            echo 'Speaker fake-haptic path detected' >&2
            exit 1
          fi

      - name: Compile signed v7 APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Game-Star-Box-0.4.27-hardware-asset-rebuild-v7.apk
          sha256sum Game-Star-Box-0.4.27-hardware-asset-rebuild-v7.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-hardware-asset-rebuild-v7
          path: Game-Star-Box-0.4.27-hardware-asset-rebuild-v7.apk
          if-no-files-found: error
          retention-days: 3
