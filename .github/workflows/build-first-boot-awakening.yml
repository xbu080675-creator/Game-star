name: Build First Boot Awakening

on:
  push:
    branches: [ feature/shoulder-ignition-boot ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch fixed CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -

      - name: Guard first boot ignition architecture
        shell: bash
        run: |
          set -euo pipefail
          ACT='app/src/main/java/com/xbu/esportscenter/BootMainActivity.java'
          STATE='app/src/main/java/com/xbu/esportscenter/core/boot/ShoulderBootStateMachine.java'
          PROV='app/src/main/java/com/xbu/esportscenter/core/boot/FirstBootProvisioningCoordinator.java'
          GATE='app/src/main/java/com/xbu/esportscenter/core/boot/IgnitionGate.java'
          JS='app/src/main/assets/native-update.js'
          HTML='app/src/main/assets/shoulder-boot.html'
          test -f "$ACT" -a -f "$STATE" -a -f "$PROV" -a -f "$GATE" -a -f "$JS" -a -f "$HTML"
          grep -q 'ARMED' "$STATE"
          grep -q 'releaseIgnition' "$STATE"
          grep -q 'GAME_CATALOG' "$PROV"
          grep -q 'MAIN_SURFACE' "$PROV"
          grep -q 'hardwareReady && provisioningReady' "$GATE"
          grep -q 'startGameCatalogPrewarm' "$ACT"
          grep -q 'mainSurfaceReady' "$ACT"
          grep -q 'prewarmHiddenMainSurface' "$JS"
          grep -q 'game-library.js' "$JS"
          grep -q 'quick-menu-runtime.js' "$JS"
          grep -q 'HARDWARE AWAKENING' "$HTML"
          if grep -q 'startFastIgnition' "$ACT" "$STATE"; then
            echo 'Fast boot bypasses provisioning gate' >&2
            exit 1
          fi

      - name: Compile signed prototype APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Game-Star-Box-0.4.27-hardware-awakening.apk
          sha256sum Game-Star-Box-0.4.27-hardware-awakening.apk

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Star-Box-0.4.27-hardware-awakening
          path: Game-Star-Box-0.4.27-hardware-awakening.apk
          if-no-files-found: error
          retention-days: 3
