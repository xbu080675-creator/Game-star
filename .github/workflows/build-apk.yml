name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-star-box-preview-ota
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}
      GSB_EXPECTED_CERT_SHA256: ${{ secrets.GSB_EXPECTED_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore protected fixed preview signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          test -n "$GSB_EXPECTED_CERT_SHA256"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch and verify CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -
          test "$(stat -c '%s' "$MUSIC_OUT")" = '634526'
          cat > app/src/main/assets/menu_bgm_license.txt <<EOF
          Game Star Box music provenance record
          Title: Spacelife #14
          Author/uploader: yd
          Source: https://opengameart.org/content/spacelife-14
          Original: $MUSIC_URL
          License shown by source: CC0
          CC0 deed: https://creativecommons.org/publicdomain/zero/1.0/
          SHA-256: $MUSIC_SHA256
          Size: 634526 bytes
          Full evidence: docs/licenses/music/SPACELIFE_14_CC0_EVIDENCE.md
          EOF

      - name: Guard privileged install surface
        shell: bash
        run: |
          set -euo pipefail
          AIDL='app/src/main/aidl/com/xbu/esportscenter/privileged/IPrivilegedInstaller.aidl'
          ADAPTER='app/src/main/java/com/xbu/esportscenter/privileged/ShizukuSelfUpdateAdapter.java'
          SERVICE='app/src/main/java/com/xbu/esportscenter/privileged/PrivilegedInstallerService.java'
          test -f "$AIDL" -a -f "$ADAPTER" -a -f "$SERVICE"
          grep -q 'com.xbu.esportscenter' "$SERVICE"
          grep -q 'installVerifiedSelfUpdate' "$ADAPTER"
          if grep -Eqi 'runShell|execCommand|interface .*Shell|String command' "$AIDL" "$ADAPTER"; then
            echo 'Generic privileged execution surface detected' >&2
            exit 1
          fi
          if grep -Eqi 'sh[[:space:]]+-c' "$SERVICE"; then
            echo 'Dynamic sh -c is forbidden in privileged installer' >&2
            exit 1
          fi

      - name: Build fixed-signed preview APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Read version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=Game-Star-Box-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Verify fixed signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          CERT="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$GSB_EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          echo "Game Star Box DEV signing SHA-256: $CERT"
          test "$CERT" = "$EXPECTED"

      - name: Prepare OTA assets
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK_NAME")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export SHA256 SIZE PUBLISHED_AT
          python3 - <<'PY'
          import json, os
          payload = {
              "schemaVersion": 1,
              "channel": "preview",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apk": os.environ["APK_NAME"],
              "sha256": os.environ["SHA256"],
              "size": int(os.environ["SIZE"]),
              "publishedAt": os.environ["PUBLISHED_AT"],
              "changelog": "0.4.9：修复启动音画不同步，启动视觉时间轴改由启动音频时钟驱动并取消 350ms 强制抢跑；原生更新面板缩成紧凑主机式卡片，减少遮挡，长更新内容可在卡片内滚动。继续保留 0.4.8 起的受限 Shizuku 自更新。"
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-star-box-preview-apk
          path: |
            ${{ env.APK_NAME }}
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish canonical GitHub preview OTA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f preview "$GITHUB_SHA"
          git push -f origin refs/tags/preview

          if gh release view preview >/dev/null 2>&1; then
            RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/preview" --jq .id)

            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq ".[] | select(.name == \"$APK_NAME\") | .id" |
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done

            # APK first; latest.json switches only after the new APK exists.
            gh release upload preview "$APK_NAME"
            gh release upload preview latest.json --clobber

            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq ".[] | select((.name | endswith(\".apk\")) and .name != \"$APK_NAME\") | .id" |
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RID" \
              -f name="Game Star Box $VERSION_NAME Preview" \
              -f body="固定 DEV 签名 OTA 预览版。0.4.9 修复启动音画同步并压缩原生更新面板；0.4.8 起支持受限 Shizuku 自更新，仅竞界自身可走静默覆盖安装。GitHub 是唯一版本真源；第三方音乐来源/许可见 THIRD_PARTY_NOTICES.md。" \
              -F prerelease=true \
              -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            gh release create preview "$APK_NAME" latest.json \
              --verify-tag \
              --title "Game Star Box $VERSION_NAME Preview" \
              --notes "固定 DEV 签名 OTA 预览版。0.4.9 修复启动音画同步并压缩原生更新面板；0.4.8 起支持受限 Shizuku 自更新，仅竞界自身可走静默覆盖安装。GitHub 是唯一版本真源；第三方音乐来源/许可见 THIRD_PARTY_NOTICES.md。" \
              --prerelease
          fi
