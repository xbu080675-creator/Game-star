name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-star-box-preview-ota
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSB_DEV_KEYSTORE_B64: ${{ secrets.GSB_DEV_KEYSTORE_B64 }}
      GSB_DEV_STORE_PASSWORD: ${{ secrets.GSB_DEV_STORE_PASSWORD }}
      GSB_DEV_KEY_PASSWORD: ${{ secrets.GSB_DEV_KEY_PASSWORD }}
      GSB_DEV_KEY_ALIAS: ${{ secrets.GSB_DEV_KEY_ALIAS }}
      GSB_EXPECTED_CERT_SHA256: ${{ secrets.GSB_EXPECTED_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore protected fixed preview signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSB_DEV_KEYSTORE_B64"
          test -n "$GSB_DEV_STORE_PASSWORD"
          test -n "$GSB_DEV_KEY_PASSWORD"
          test -n "$GSB_DEV_KEY_ALIAS"
          test -n "$GSB_EXPECTED_CERT_SHA256"
          printf '%s' "$GSB_DEV_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/gsb-dev.keystore"
          keytool -list -keystore "$RUNNER_TEMP/gsb-dev.keystore" -storepass "$GSB_DEV_STORE_PASSWORD" -alias "$GSB_DEV_KEY_ALIAS" >/dev/null
          echo "GSB_DEV_KEYSTORE=$RUNNER_TEMP/gsb-dev.keystore" >> "$GITHUB_ENV"

      - name: Fetch and verify CC0 menu music
        shell: bash
        run: |
          set -euo pipefail
          MUSIC_URL='https://opengameart.org/sites/default/files/spacelifeNo14.ogg'
          MUSIC_SHA256='64ba0b12ee09c106bca11531010534df282f3474a88fb1923d55b3de469898d4'
          MUSIC_OUT='app/src/main/assets/menu_bgm.ogg'
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "$MUSIC_URL" -o "$MUSIC_OUT"
          echo "$MUSIC_SHA256  $MUSIC_OUT" | sha256sum -c -
          test "$(stat -c '%s' "$MUSIC_OUT")" = '634526'
          cat > app/src/main/assets/menu_bgm_license.txt <<EOF
          Game Star Box music provenance record
          Title: Spacelife #14
          Author/uploader: yd
          Source: https://opengameart.org/content/spacelife-14
          Original: $MUSIC_URL
          License shown by source: CC0
          CC0 deed: https://creativecommons.org/publicdomain/zero/1.0/
          SHA-256: $MUSIC_SHA256
          Size: 634526 bytes
          Full evidence: docs/licenses/music/SPACELIFE_14_CC0_EVIDENCE.md
          EOF

      - name: Guard privileged install surface
        shell: bash
        run: |
          set -euo pipefail
          AIDL='app/src/main/aidl/com/xbu/esportscenter/privileged/IPrivilegedInstaller.aidl'
          ADAPTER='app/src/main/java/com/xbu/esportscenter/privileged/ShizukuSelfUpdateAdapter.java'
          SERVICE='app/src/main/java/com/xbu/esportscenter/privileged/PrivilegedInstallerService.java'
          test -f "$AIDL" -a -f "$ADAPTER" -a -f "$SERVICE"
          grep -q 'com.xbu.esportscenter' "$SERVICE"
          grep -q 'installVerifiedSelfUpdate' "$ADAPTER"
          if grep -Eqi 'runShell|execCommand|interface .*Shell|String command' "$AIDL" "$ADAPTER"; then
            echo 'Generic privileged execution surface detected' >&2
            exit 1
          fi
          if grep -Eqi 'sh[[:space:]]+-c' "$SERVICE"; then
            echo 'Dynamic sh -c is forbidden in privileged installer' >&2
            exit 1
          fi

      - name: Guard backend privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          CORE='app/src/main/java/com/xbu/esportscenter/core'
          RM='app/src/main/java/com/xbu/esportscenter/platform/redmagic'
          test -d "$CORE" -a -d "$RM"
          if grep -R -Eqi 'android\.content|android\.provider|rikka\.shizuku|ProcessBuilder|Runtime\.getRuntime|/system/bin|/sys/' "$CORE"; then
            echo 'Platform or privileged API leaked into Core' >&2
            exit 1
          fi
          if grep -R -Eqi 'Settings\.(Global|Secure|System)\.put|rikka\.shizuku|ProcessBuilder|Runtime\.getRuntime' "$RM"; then
            echo 'REDMAGIC adapter must remain read-only and non-privileged in this preview' >&2
            exit 1
          fi

      - name: Guard REDMAGIC capability survey
        shell: bash
        run: |
          set -euo pipefail
          IDS='app/src/main/java/com/xbu/esportscenter/core/capability/GameCapabilityIds.java'
          PROBE='app/src/main/java/com/xbu/esportscenter/platform/redmagic/RedMagicCapabilityProbe.java'
          SNAP='app/src/main/java/com/xbu/esportscenter/platform/redmagic/RedMagicCapabilityProbeSnapshot.java'
          AUDIT='app/src/main/java/com/xbu/esportscenter/platform/redmagic/RedMagicNativeEntryAudit.java'
          AUDIT_SNAP='app/src/main/java/com/xbu/esportscenter/platform/redmagic/RedMagicNativeEntryAuditSnapshot.java'
          MANIFEST='app/src/main/AndroidManifest.xml'
          test -f "$IDS" -a -f "$PROBE" -a -f "$SNAP" -a -f "$AUDIT" -a -f "$AUDIT_SNAP"
          grep -q 'game.performance.boost' "$IDS"
          grep -q 'game.interruption.shield' "$IDS"
          grep -q 'device.fan_control' "$IDS"
          grep -q '<package android:name="cn.nubia.gamelauncher"' "$MANIFEST"
          grep -q '<package android:name="cn.nubia.gameassist"' "$MANIFEST"
          if grep -Eqi 'Settings\.(Global|Secure|System)\.put|rikka\.shizuku|ProcessBuilder|Runtime\.getRuntime|write\(' "$PROBE" "$AUDIT"; then
            echo 'REDMAGIC survey/audit must stay read-only' >&2
            exit 1
          fi
          if grep -Eqi 'startActivity|startService|bindService|sendBroadcast|ContentResolver\.call|acquireContentProviderClient' "$AUDIT"; then
            echo 'REDMAGIC native entry audit must not invoke discovered components' >&2
            exit 1
          fi

      - name: Guard installed game catalog
        shell: bash
        run: |
          set -euo pipefail
          CATALOG='app/src/main/java/com/xbu/esportscenter/platform/android/InstalledGameCatalog.java'
          BRIDGE='app/src/main/java/com/xbu/esportscenter/BootMainActivity.java'
          UI='app/src/main/assets/game-library.js'
          MANIFEST='app/src/main/AndroidManifest.xml'
          test -f "$CATALOG" -a -f "$BRIDGE" -a -f "$UI"
          grep -q 'Intent.CATEGORY_LAUNCHER' "$CATALOG"
          grep -q 'createValidatedLaunchIntent' "$CATALOG"
          grep -q 'isVisibleLauncherPackage' "$CATALOG"
          grep -q 'GSBGames' "$BRIDGE"
          grep -q 'gsb.manualGames.v1' "$UI"
          grep -q 'android.intent.category.LAUNCHER' "$MANIFEST"
          if grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"; then
            echo 'Broad QUERY_ALL_PACKAGES is forbidden for the game catalog' >&2
            exit 1
          fi
          if grep -Eqi 'ProcessBuilder|Runtime\.getRuntime|rikka\.shizuku|Settings\.(Global|Secure|System)\.put' "$CATALOG"; then
            echo 'Installed game catalog must stay non-privileged' >&2
            exit 1
          fi

      - name: Guard Boot Orchestrator boundary
        shell: bash
        run: |
          set -euo pipefail
          BOOT='app/src/main/java/com/xbu/esportscenter/core/boot'
          BRIDGE='app/src/main/java/com/xbu/esportscenter/BootMainActivity.java'
          BOOT_JS='app/src/main/assets/native-update.js'
          test -f "$BOOT/BootPhase.java" -a -f "$BOOT/BootSnapshot.java" -a -f "$BOOT/BootOrchestrator.java"
          test -f "$BRIDGE" -a -f "$BOOT_JS"
          grep -q 'WEBVIEW_READY' "$BOOT/BootPhase.java"
          grep -q 'BOOT_COMPLETE' "$BOOT/BootPhase.java"
          grep -q 'GSBBoot' "$BRIDGE"
          grep -q 'webViewReady' "$BRIDGE"
          grep -q 'playbackRateFor' "$BOOT_JS"
          if grep -R -Eqi 'android\.|rikka\.shizuku|Settings\.|ProcessBuilder|Runtime\.getRuntime|/system/bin|/sys/' "$BOOT"; then
            echo 'Boot Orchestrator must remain platform-neutral' >&2
            exit 1
          fi
          if grep -Eqi 'rikka\.shizuku|ProcessBuilder|Runtime\.getRuntime|Settings\.(Global|Secure|System)\.put' "$BRIDGE"; then
            echo 'Boot bridge must not expose privileged execution' >&2
            exit 1
          fi

      - name: Guard Game Star Box startup identity
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='app/src/main/AndroidManifest.xml'
          BASE='app/src/main/res/values/styles.xml'
          V31='app/src/main/res/values-v31/styles.xml'
          TRANSPARENT='app/src/main/res/drawable/gsb_boot_transparent.xml'
          test -f "$MANIFEST" -a -f "$BASE" -a -f "$V31" -a -f "$TRANSPARENT"
          grep -q 'android:theme="@style/Theme.EsportsCenter.Starting"' "$MANIFEST"
          grep -q 'android:name=".MainActivity"' "$MANIFEST"
          grep -q 'android:targetActivity=".BootMainActivity"' "$MANIFEST"
          grep -q 'name="Theme.EsportsCenter.Starting"' "$BASE"
          grep -q 'android:windowBackground">#000000' "$BASE"
          grep -q 'android:windowSplashScreenBackground">#000000' "$V31"
          grep -q 'android:windowSplashScreenAnimatedIcon">@drawable/gsb_boot_transparent' "$V31"
          grep -q 'android:windowSplashScreenAnimationDuration">0' "$V31"
          if grep -q '@drawable/gsb_boot_preview' "$BASE"; then
            echo 'Independent platform boot artwork must not own startup visuals' >&2
            exit 1
          fi

      - name: Build fixed-signed preview APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Read version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=Game-Star-Box-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Verify fixed signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          CERT="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$GSB_EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          echo "Game Star Box DEV signing SHA-256: $CERT"
          test "$CERT" = "$EXPECTED"

      - name: Prepare OTA assets
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK_NAME")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export SHA256 SIZE PUBLISHED_AT
          python3 - <<'PY'
          import json, os
          payload = {
              "schemaVersion": 1,
              "channel": "preview",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apk": os.environ["APK_NAME"],
              "sha256": os.environ["SHA256"],
              "size": int(os.environ["SIZE"]),
              "publishedAt": os.environ["PUBLISHED_AT"],
              "changelog": "0.4.19：真实游戏库 Phase 1。移除首页和游戏库的默认示例游戏数据，改为读取本机 MAIN/LAUNCHER 应用并用 Android 游戏分类自动识别；支持从本机可启动应用中手动添加/移除非标准分类游戏，显示真实应用图标/名称/包名并从竞界直接启动。启动目标严格限制在本次枚举的 launcher allow-list；未申请 QUERY_ALL_PACKAGES，不新增 Shizuku/shell/系统写权限。每版本继续独立开发留档。"
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-star-box-preview-apk
          path: |
            ${{ env.APK_NAME }}
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish canonical GitHub preview OTA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f preview "$GITHUB_SHA"
          git push -f origin refs/tags/preview

          if gh release view preview >/dev/null 2>&1; then
            RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/preview" --jq .id)

            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq ".[] | select(.name == \"$APK_NAME\") | .id" |
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done

            gh release upload preview "$APK_NAME"
            gh release upload preview latest.json --clobber

            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq ".[] | select((.name | endswith(\".apk\")) and .name != \"$APK_NAME\") | .id" |
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RID" \
              -f name="Game Star Box $VERSION_NAME Preview" \
              -f body="固定 DEV 签名 OTA 预览版。0.4.19 将首页与游戏库从默认示例数据切换为本机真实游戏/用户手动添加的 launcher 应用，并通过受限 GSBGames 桥启动；启动包必须来自当前枚举 allow-list，不申请 QUERY_ALL_PACKAGES，不扩大 Shizuku/REDMAGIC 权限面。独立开发记录见 docs/versions/0.4.19.md。" \
              -F prerelease=true \
              -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            gh release create preview "$APK_NAME" latest.json \
              --verify-tag \
              --title "Game Star Box $VERSION_NAME Preview" \
              --notes "固定 DEV 签名 OTA 预览版。0.4.19 将首页与游戏库从默认示例数据切换为本机真实游戏/用户手动添加的 launcher 应用，并通过受限 GSBGames 桥启动；启动包必须来自当前枚举 allow-list，不申请 QUERY_ALL_PACKAGES，不扩大 Shizuku/REDMAGIC 权限面。独立开发记录见 docs/versions/0.4.19.md。" \
              --prerelease
          fi
